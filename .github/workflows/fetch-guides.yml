name: Daily Guide Fetcher

on:
  schedule:
    # Runs automatically every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # This magical line gives you a "Run workflow" button in the GitHub UI 
    # so you can trigger it manually whenever you want!

permissions:
  contents: write # Allows the action to commit files back to your repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Browser Harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ./browser-harness
      - name: Run Scraper
        env:
          BU_HEADLESS: "1"
        run: |
          # Start the pre-installed Google Chrome in background
          google-chrome --headless --remote-debugging-port=9222 --disable-gpu &
          sleep 5
          python3 knowledge-ingest/scripts/fetch_guides.py
      - name: Commit and Push New Guides
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the downloaded guides and the updated SQLite database
          git add raw/guides/ knowledge-ingest/scraper_manifest.db
          
          # Check if there are actual changes, commit, and push
          git diff --staged --quiet || (git commit -m "Auto-fetched new Matomo guides" && git push)